# Fluxo: proxy reverso para o backend Node (pm2, 127.0.0.1:3001), que serve a API, o dist/ e /uploads.
# Instalado pelo deploy/setup.sh em /etc/nginx/sites-available/fluxo; o certbot --nginx acrescenta
# o bloco 443/SSL e o redirect HTTP -> HTTPS neste arquivo.
server {
    listen 80;
    listen [::]:80;
    server_name fluxoagendamentos.com.br;

    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sobrescreve (não concatena) o X-Forwarded-For: com trust proxy 'loopback' o req.ip vira o IP real
        # do cliente e um X-Forwarded-For forjado não burla o rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
